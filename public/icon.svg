<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#881337;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#be123c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e11d48;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef08a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Gold Decorative Border Ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="10" opacity="0.8" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 8" opacity="0.6" />

  <!-- Auspicious Kalash / Reshimgath Knot Emblem -->
  <!-- Two Interlocked Golden Rings (Reshim Bandh) at the bottom -->
  <circle cx="215" cy="380" r="42" fill="none" stroke="url(#goldGrad)" stroke-width="12" />
  <circle cx="297" cy="380" r="42" fill="none" stroke="url(#goldGrad)" stroke-width="12" />

  <!-- Devanagari 'अ' for अनुबंध in Crisp Clean White (Without any dot/anusvara on top) -->
  <text x="256" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans Devanagari', 'Mangal', 'Segoe UI', sans-serif" font-size="220" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#shadow)">अ</text>
</svg>
